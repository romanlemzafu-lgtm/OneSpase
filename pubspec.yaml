name: onespase
description: OneSpase — cozy social network + messenger prototype.
publish_to: "none"

version: 0.4.0+5

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/onespase_logo.png
    - assets/images/onespase_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/onespase_icon.png"
  min_sdk_android: 23
